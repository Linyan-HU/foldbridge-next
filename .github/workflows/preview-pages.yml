name: Deploy FoldBridge preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foldbridge-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the search index
        run: |
          node scripts/build-search-docs.mjs
          npm exec pagefind -- --site dist/search-docs --output-path dist/pagefind
      - name: Assemble the static portal
        run: |
          mkdir -p _site/dist
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=public \
            --exclude=dist \
            --exclude=CNAME \
            --exclude=test \
            --exclude=tests \
            --exclude=docs \
            ./ _site/
          cp -R dist/pagefind _site/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
