<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">Concise icons for RNA probing and structure-determination methods</title>
  <desc id="desc">Three chemical-probing icons for DMS, SHAPE, and icSHAPE, plus three structure-determination icons for X-ray crystallography, cryo-electron microscopy, and NMR spectroscopy.</desc>
  <style>
    .ink { fill: none; stroke: #242424; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .fine { fill: none; stroke: #808080; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: #242424; }
    .gray { fill: #808080; }
    .label { fill: #242424; font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 600; text-anchor: middle; }
    .caption { fill: #808080; font-family: Arial, Helvetica, sans-serif; font-size: 16px; text-anchor: middle; letter-spacing: .4px; }
    .group { fill: #242424; font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 600; letter-spacing: 1.2px; }
    .chem { fill: #242424; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 500; text-anchor: middle; }
    .small { fill: #808080; font-family: Arial, Helvetica, sans-serif; font-size: 15px; text-anchor: middle; }
  </style>

  <text class="group" x="55" y="48">CHEMICAL PROBING</text>
  <path class="fine" d="M55 64H680"/>
  <text class="group" x="770" y="48">STRUCTURE DETERMINATION</text>
  <path class="fine" d="M770 64H1385"/>

  <!-- DMS: dimethyl sulfate transfers methyl groups to accessible bases. -->
  <g transform="translate(45 82)">
    <text class="chem" x="92" y="62">MeO</text>
    <text class="chem" x="92" y="145">MeO</text>
    <text class="chem" x="166" y="109">S</text>
    <text class="chem" x="235" y="62">O</text>
    <text class="chem" x="235" y="145">O</text>
    <path class="ink" d="M120 68L149 94M120 139L149 116M183 98L216 68M183 113L216 139"/>
    <path class="fine" d="M187 92L218 61M187 119L218 150"/>
    <path class="ink" d="M266 105H326"/>
    <path class="ink" d="M315 94L332 105L315 116"/>
    <text class="small" x="298" y="88">CH₃</text>
    <circle class="ink" cx="369" cy="105" r="31"/>
    <text class="chem" x="369" y="112">A/C</text>
    <text class="label" x="190" y="213">DMS</text>
    <text class="caption" x="190" y="239">methylation of exposed bases</text>
  </g>

  <!-- SHAPE: a named SHAPE reagent acylates the flexible 2-prime hydroxyl. -->
  <g transform="translate(470 82)">
    <path class="ink" d="M75 61L107 43L139 61L139 98L107 116L75 98Z"/>
    <text class="chem" x="107" y="84">1M7</text>
    <path class="ink" d="M164 80H224"/>
    <path class="ink" d="M213 69L230 80L213 91"/>
    <path class="ink" d="M252 56C286 38 319 51 341 76C359 96 387 111 419 98"/>
    <circle class="ink" cx="269" cy="51" r="16"/>
    <circle class="ink" cx="348" cy="82" r="16"/>
    <circle class="ink" cx="420" cy="98" r="16"/>
    <path class="ink" d="M348 99V136"/>
    <text class="chem" x="348" y="163">2′-OH</text>
    <path class="fine" d="M370 140C390 127 406 129 424 143"/>
    <text class="label" x="246" y="213">SHAPE</text>
    <text class="caption" x="246" y="239">flexible 2′-OH acylation</text>
  </g>

  <!-- icSHAPE: in-cell click-compatible probing with sequencing readout. -->
  <g transform="translate(895 82)">
    <circle class="ink" cx="64" cy="93" r="48"/>
    <path class="fine" d="M35 92C44 72 57 112 68 90C79 68 91 111 99 88"/>
    <text class="small" x="64" y="157">cell</text>
    <path class="ink" d="M124 93H180"/>
    <path class="ink" d="M169 82L186 93L169 104"/>
    <circle class="ink" cx="218" cy="93" r="25"/>
    <text class="chem" x="218" y="100">N₃</text>
    <path class="ink" d="M251 93H303"/>
    <path class="ink" d="M292 82L309 93L292 104"/>
    <path class="ink" d="M330 58V128M330 128H409M342 116H397M342 101H381M342 86H405M342 71H369"/>
    <circle class="solid" cx="363" cy="101" r="4"/>
    <circle class="solid" cx="384" cy="86" r="4"/>
    <circle class="solid" cx="395" cy="116" r="4"/>
    <text class="label" x="210" y="213">icSHAPE</text>
    <text class="caption" x="210" y="239">in-cell probe → sequencing</text>
  </g>

  <!-- X-ray crystallography: crystal, incident X-ray beam, and diffraction pattern. -->
  <g transform="translate(45 290)">
    <path class="ink" d="M30 68H116"/>
    <path class="ink" d="M30 58H116M30 78H116"/>
    <path class="ink" d="M105 57L123 68L105 79"/>
    <path class="ink" d="M158 42L199 68L181 114L135 106L122 64Z"/>
    <path class="fine" d="M122 64L181 114M158 42L181 114M135 106L199 68"/>
    <circle class="solid" cx="259" cy="44" r="4"/><circle class="solid" cx="284" cy="57" r="4"/><circle class="solid" cx="299" cy="82" r="4"/>
    <circle class="solid" cx="305" cy="107" r="4"/><circle class="solid" cx="284" cy="128" r="4"/><circle class="solid" cx="260" cy="139" r="4"/>
    <circle class="solid" cx="235" cy="128" r="4"/><circle class="solid" cx="219" cy="104" r="4"/><circle class="solid" cx="221" cy="78" r="4"/>
    <circle class="solid" cx="238" cy="56" r="4"/><circle class="solid" cx="260" cy="92" r="5"/>
    <text class="label" x="190" y="181">X-ray</text>
    <text class="caption" x="190" y="207">crystal diffraction</text>
  </g>

  <!-- Cryo-EM: vitrified-particle grid and a reconstructed density contour. -->
  <g transform="translate(470 290)">
    <rect class="ink" x="18" y="35" width="104" height="104" rx="3"/>
    <path class="fine" d="M44 35V139M70 35V139M96 35V139M18 61H122M18 87H122M18 113H122"/>
    <circle class="solid" cx="33" cy="51" r="4"/><circle class="solid" cx="61" cy="75" r="4"/><circle class="solid" cx="88" cy="50" r="4"/>
    <circle class="solid" cx="106" cy="79" r="4"/><circle class="solid" cx="43" cy="111" r="4"/><circle class="solid" cx="76" cy="122" r="4"/>
    <path class="ink" d="M146 87H199"/>
    <path class="ink" d="M188 76L205 87L188 98"/>
    <path class="ink" d="M278 45C326 38 361 60 352 86C374 113 338 139 295 130C264 148 230 120 244 92C225 67 245 46 278 45Z"/>
    <path class="fine" d="M283 61C315 56 336 70 329 88C345 107 322 122 294 116C273 128 252 110 261 91C247 75 261 61 283 61Z"/>
    <path class="fine" d="M289 76C307 73 319 82 315 92C324 102 310 110 295 107C283 113 272 104 276 93C268 84 277 77 289 76Z"/>
    <text class="label" x="190" y="181">cryo-EM</text>
    <text class="caption" x="190" y="207">particle grid → density map</text>
  </g>

  <!-- NMR: magnet and a two-dimensional cross-peak spectrum. -->
  <g transform="translate(895 290)">
    <path class="ink" d="M38 43V96C38 136 102 136 102 96V43"/>
    <path class="ink" d="M38 43H65V74H38ZM75 43H102V74H75Z"/>
    <text class="small" x="51" y="64">N</text>
    <text class="small" x="89" y="64">S</text>
    <path class="ink" d="M126 91H184"/>
    <path class="ink" d="M173 80L190 91L173 102"/>
    <path class="ink" d="M220 38V142M220 142H392"/>
    <path class="fine" d="M248 38V142M276 38V142M304 38V142M332 38V142M360 38V142M220 114H392M220 86H392M220 58H392"/>
    <ellipse class="ink" cx="276" cy="112" rx="12" ry="8"/>
    <ellipse class="ink" cx="332" cy="86" rx="12" ry="8"/>
    <ellipse class="ink" cx="360" cy="58" rx="12" ry="8"/>
    <ellipse class="fine" cx="276" cy="112" rx="20" ry="14"/>
    <ellipse class="fine" cx="332" cy="86" rx="20" ry="14"/>
    <ellipse class="fine" cx="360" cy="58" rx="20" ry="14"/>
    <text class="label" x="205" y="181">NMR</text>
    <text class="caption" x="205" y="207">magnet → 2D spectrum</text>
  </g>
</svg>
