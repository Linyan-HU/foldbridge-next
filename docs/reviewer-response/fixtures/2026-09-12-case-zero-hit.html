<!doctype html>
<meta charset="utf-8">
<title>FoldBridge zero-hit DOM fixture</title>
<iframe id="case" title="8SQ9 zero-hit DOM fixture" src="/entry-cases/cases/8SQ9/chains/P/index.html?profileId=data-rna-structures%2FPDB130_2A3_0000.rdat%2313322" style="border:0;width:100%;height:1800px"></iframe>
<script>
  const frame = document.querySelector('#case');
  frame.addEventListener('load', () => {
    const poll = setInterval(() => {
      const chip = frame.contentDocument?.querySelector('.technique-chip[disabled]');
      if (!chip) return;
      clearInterval(poll);
      chip.removeAttribute('disabled');
      chip.dataset.zeroHitFixture = 'enabled';
      document.title = `ready: ${chip.textContent.trim()}`;
    }, 50);
  });
</script>
